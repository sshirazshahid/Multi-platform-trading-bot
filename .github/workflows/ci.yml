name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin ruff version to match .pre-commit-config.yaml (v0.9.6)
      - name: Install linters
        run: pip install "ruff==0.9.6" codespell

      - name: Ruff check
        run: >
          ruff check skills/ scripts/

      - name: Ruff format check
        run: >
          ruff format --check skills/ scripts/

      # Use pyproject.toml config for skip/ignore-words-list
      - name: Codespell
        run: >
          codespell --toml pyproject.toml skills/ scripts/

      # Phase 0e: byte-compile sweep over core/ + scripts/ (syntax-shape gate).
      - name: Compile sweep (core + scripts)
        run: python scripts/compile_sweep.py

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        # Project is scripts-only (packages = [] in pyproject) -> NOT pip-installable as a
        # package (editable/wheel build produces 0 .egg-info on modern setuptools). Tests
        # run via sys.path + importlib, so install the dependencies directly.
        run: pip install pytest pytest-cov coverage jsonschema pyyaml scipy pandas numpy requests

      # Run each skill's tests in isolation to avoid module name collisions
      # (each skill has its own scorer.py, calculators/, helpers.py).
      # Order: alphabetical by skill name.
      - name: Test repo scripts
        run: >
          python -m pytest scripts/tests/ -v
          --cov=scripts --cov-report=term-missing

      - name: Test exchange-connectivity
        run: >
          python -m pytest skills/exchange-connectivity/scripts/tests/ -v
          --cov=skills/exchange-connectivity/scripts
          --cov-report=term-missing
          --cov-append

      - name: Test futures-universe-edge-research
        run: >
          python -m pytest skills/futures-universe-edge-research/scripts/tests/ -v
          --cov=skills/futures-universe-edge-research/scripts
          --cov-report=term-missing
          --cov-append

      - name: Test tp-precision-engine
        run: >
          python -m pytest skills/tp-precision-engine/scripts/tests/ -v
          --cov=skills/tp-precision-engine/scripts
          --cov-report=term-missing
          --cov-append

      - name: Test trading-backtest-validation
        run: >
          python -m pytest skills/trading-backtest-validation/scripts/tests/ -v
          --cov=skills/trading-backtest-validation/scripts
          --cov-report=term-missing
          --cov-append

      - name: Test trading-monitoring
        run: >
          python -m pytest skills/trading-monitoring/scripts/tests/ -v
          --cov=skills/trading-monitoring/scripts
          --cov-report=term-missing
          --cov-append

      - name: Test trading-risk-management
        run: >
          python -m pytest skills/trading-risk-management/scripts/tests/ -v
          --cov=skills/trading-risk-management/scripts
          --cov-report=term-missing
          --cov-append

      - name: Test windows-bot-deployment
        run: >
          python -m pytest skills/windows-bot-deployment/scripts/tests/ -v
          --cov=skills/windows-bot-deployment/scripts
          --cov-report=term-missing
          --cov-append
      - name: Coverage summary
        if: always()
        run: python -m coverage report

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  research-labs:
    name: Research labs (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The labs + data_io + MCP warehouse reader are stdlib-only by design;
      # only pytest (+ ruff for lint) is needed. Scope ruff to the new modules
      # because some pre-existing research/ files are not yet ruff-clean.
      - name: Install tools
        run: pip install pytest "ruff==0.9.6"

      - name: Ruff check (research labs + mcp_server)
        run: >
          ruff check
          research/dca_rebalance_lab.py research/funding_carry_lab.py
          research/data_io.py research/run_spot_study.py mcp_server/

      - name: Ruff format check (research labs + mcp_server)
        run: >
          ruff format --check
          research/dca_rebalance_lab.py research/funding_carry_lab.py
          research/data_io.py research/run_spot_study.py mcp_server/

      - name: Test research labs + data_io + MCP reader
        run: >
          python -m pytest
          tests/test_dca_rebalance_lab.py
          tests/test_funding_carry_lab.py
          tests/test_data_io.py
          tests/test_trading_bot_mcp.py
          tests/test_research_labs_realdata.py
          -v

  bot-decision-tests:
    name: Bot decision-core (import-light)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # The decision-core seam is deliberately import-light: numpy + scipy (the stat
      # stack behind promotion_gate/stat_tests) + python-dotenv (config) + pandas.
      # NO ccxt / schedule — these tests never construct BotEngine or touch an exchange.
      - name: Install import-light deps
        run: pip install pytest numpy scipy pandas python-dotenv

      - name: Test decision core (guardrails / monte_carlo / promotion_loop / mutator)
        run: >
          python -m pytest
          tests/test_self_improve_guardrails.py
          tests/test_monte_carlo.py
          tests/test_promotion_loop_latch.py
          tests/test_mutator.py
          tests/test_promotion_gate_inputs.py
          -v

  bot-tests:
    name: Bot full suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Full bot test suite (~2002 tests). requirements.txt carries
      # ccxt/pandas/numpy/scipy/scikit-learn/etc. Runs on windows-latest to match
      # the runtime OS (the system-audit process snapshot + path tests are
      # Windows-shaped). Verified 2002 passing locally on this OS + Python.
      - name: Install bot dependencies
        run: pip install -r requirements.txt pytest

      - name: Run bot test suite
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: MCP import and tool-contract smoke
        run: python -m pytest tests/test_mcp_server_smoke.py -q

  qtb-audit:
    name: QTB audit (stdlib research stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run QTB audit suite (43 tests)
        run: python qtb/tests/test_suite.py -v

      - name: QTB demo smoke (noise grid promotes 0)
        run: |
          python qtb/scripts/demo.py | tee /tmp/qtb_demo.out
          grep -q "PROMOTED: 0" /tmp/qtb_demo.out

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install security tools
        run: pip install "bandit[toml]>=1.9.0" "detect-secrets>=1.5.0"

      - name: Bandit SAST scan
        run: >
          bandit -c pyproject.toml -r skills/ scripts/
          --exclude "*/tests/*"

      # New visibility baseline over the bot itself (2026-08-04). Advisory
      # only: this code has never been bandit-scanned, so a hard gate would
      # fail on legacy findings. Tighten once the backlog is triaged.
      - name: Bandit SAST scan (bot core, advisory)
        continue-on-error: true
        run: >
          bandit -c pyproject.toml -r core/ exchanges/ config/
          --exclude "*/tests/*"

      # Compare a fresh scan against committed baseline (results only, ignore metadata)
      - name: Detect secrets check
        run: |
          # fetch_earnings_fmp.py excluded: line 10 is a docstring placeholder
          # (export FMP_API_KEY="your-key"), flagged only by CI's detect-secrets as a
          # templated-placeholder false positive — verified not a real secret.
          detect-secrets scan \
            --exclude-files '\.env$|\.json$|\.csv$|\.md$|\.zip$|\.baseline$|fetch_earnings_fmp\.py$' \
            > /tmp/new_scan.json
          python3 -c "
          import json, sys
          with open('.secrets.baseline') as f: old = json.load(f)
          with open('/tmp/new_scan.json') as f: new = json.load(f)
          old_set = {(p, i['hashed_secret'], i['line_number'])
                     for p, items in old.get('results', {}).items() for i in items}
          new_set = {(p, i['hashed_secret'], i['line_number'])
                     for p, items in new.get('results', {}).items() for i in items}
          diff = new_set - old_set
          if diff:
              print(f'ERROR: {len(diff)} new secret(s) not in baseline:')
              for p, h, ln in sorted(diff):
                  print(f'  {p}:{ln}')
              sys.exit(1)
          print(f'OK: {len(new_set)} known, 0 new')
          "
