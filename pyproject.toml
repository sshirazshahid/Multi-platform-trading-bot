[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This is a scripts-only project, not a Python package
packages = []

[project]
name = "claude-trading-skills"
version = "0.1.0"
description = "Claude Skills for equity investors and traders"
requires-python = ">=3.9"
dependencies = [
    "jsonschema>=4.25.1",
    "pyyaml>=6.0",
    "scipy>=1.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.9.0",
    "bandit[toml]>=1.7.0",
    "detect-secrets>=1.5.0",
    "codespell>=2.3.0",
    "pre-commit>=3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "E402",  # module-level import not at top (sys.path manipulation in conftest)
    "B904",  # raise-without-from-inside-except (fix incrementally)
    "B007",  # unused-loop-control-variable (fix incrementally)
    "B017",  # assert-raises-exception (fix incrementally)
    "UP007",  # PEP 604 X | Y for Union/Optional requires py3.10; target-version is py39
    "UP045",  # PEP 604 X | None syntax requires py3.10; target-version is py39
    "UP006",  # PEP 585 generic types require py3.9+ but we target py3.9 conservatively
    "UP035",  # deprecated typing imports — same py3.9 concern
    "UP031",  # percent-format → format specifiers (style only; fix incrementally)
    "E701",  # multiple-statements-on-one-line-colon (incremental)
    "E702",  # multiple-statements-on-one-line-semicolon (incremental)
    "E741",  # ambiguous-variable-name (l / I / O — incremental)
    "E731",  # lambda-assignment (style preference)
]

[tool.ruff.lint.per-file-ignores]
"**/conftest.py" = ["E402"]
"**/test_*.py" = ["E402"]

[tool.pytest.ini_options]
# Default pytest focuses on the trading-bot repo tests. Skill-pack/script
# tooling tests are intentionally targeted explicitly (for example:
# `pytest skills/backtest-expert/scripts/tests`) because many independent
# skills intentionally reuse module names like scorer.py, calculators/, and
# helpers.py, and some docs tooling tests require UTF-8 fixture writes on
# Windows.
addopts = "--import-mode=importlib"
testpaths = [
    "tests",
]

[tool.bandit]
targets = ["skills"]
skips = [
    "B101",  # assert used (normal in non-production code)
    "B110",  # try-except-pass
    "B113",  # requests without timeout (pre-existing in test scripts)
    "B310",  # urllib urlopen (used for FMP API calls with validated URLs)
    "B311",  # random (used for non-security skill selection)
    "B404",  # import subprocess (needed for test runner)
    "B603",  # subprocess without shell=true (intentionally safe pattern)
]

[tool.codespell]
skip = ".venv,*.json,*.csv,*.baseline,skill-packages,*.pyc,__pycache__"
ignore-words-list = "trough,ore,cna,acn,blok,hims,pont,claus,theses,ot,fo,interm,nd,ser,strat,unparseable"

[tool.coverage.run]
source = ["skills", "core", "exchanges", "mcp_server", "research", "scripts", "strategies", "quant_suite", "ntrader"]

[tool.coverage.report]
fail_under = 40
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]
